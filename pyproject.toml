[project]
name = "snake-rl"
version = "0.1.0"
description = "面向强化学习训练深度优化的贪吃蛇游戏引擎、Gymnasium 环境与实时遥测可视化套件"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26.0",
    "pygame>=2.6.0",
    "torch>=2.2.0",
    "matplotlib>=3.8.0",
    "tensorboard>=2.16.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
snake-play = "snake_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snake_rl"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 禁止自动加载本机 ROS 2 Humble 全局 PYTHONPATH 中的第三方外部插件
addopts = "--disable-plugin-autoload"




